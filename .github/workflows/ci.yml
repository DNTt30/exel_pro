name: Continuous Integration (CI)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-rules:
    name: PostgreSQL permissions and schedule transactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 55442:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check database rules on disposable fixture
        env:
          STABILITY_PSQL: psql
          STABILITY_PG_PORT: '55442'
          PGPASSWORD: local-ci-only
        run: |
          python scripts/test_practical_workflows.py
          python scripts/test_handbook_catalog.py
          python scripts/test_copilot_rate_limit.py
  test-and-lint:
    name: Lint, Test & Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Code Quality & Linting (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Run Test Suite (vitest)
        working-directory: frontend
        run: npm test

      - name: Production Build Check
        working-directory: frontend
        env:
          VITE_BASE_PATH: /exel_pro/
        run: npm run build
