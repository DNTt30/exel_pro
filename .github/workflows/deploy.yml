name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Cổng chất lượng: chặn deploy nếu lint lỗi hoặc test đỏ
      - name: Lint & Test (gate)
        working-directory: frontend
        run: |
          npm run lint
          npm run test
      - name: Build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /exel_pro/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_OTP_URL: ${{ secrets.VITE_ADMIN_OTP_URL }}
          VITE_TELEGRAM_PROXY_SECRET: ${{ secrets.VITE_TELEGRAM_PROXY_SECRET }}
        # NOTE: giá trị fallback dưới đây là Supabase URL + anon key PHÁT HÀNH CÔNG KHAI
        # (luôn nhúng trong bundle client nên không phải secret). Khi rotate key,
        # nhớ sửa cả fallback này hoặc cấu hình secrets trong GH Settings.
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            export VITE_SUPABASE_URL="https://plitfdjzuealjxbylwxy.supabase.co"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            export VITE_SUPABASE_ANON_KEY="sb_publishable_NSojsCWhOgiUvZIrMpoXEg_So_tE3O_"
          fi
          npm run build
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
