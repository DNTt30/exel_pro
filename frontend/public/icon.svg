<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Orange GS25 Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Gloss Top Arc -->
  <path d="M0,112 C0,50.134 50.134,0 112,0 L400,0 C461.866,0 512,50.134 512,112 L512,180 C360,240 160,240 0,180 Z" fill="url(#glossGrad)"/>

  <!-- Subtle Cyan Curved Stripe Accent -->
  <path d="M-50,420 Q180,360 562,440 L562,512 L-50,512 Z" fill="#0369a1" opacity="0.4"/>
  <path d="M-20,440 Q200,380 532,460" stroke="url(#accentGrad)" stroke-width="8" fill="none" opacity="0.8"/>

  <!-- Center Card Container -->
  <g filter="url(#glow)">
    <!-- Top Pill: DNT -->
    <g transform="translate(256, 120)">
      <rect x="-80" y="-28" width="160" height="56" rx="28" fill="#ffffff" filter="url(#badgeShadow)"/>
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#1e3a8a" text-anchor="middle" letter-spacing="4">DNT</text>
    </g>

    <!-- Main Text: GS25 -->
    <g transform="translate(256, 280)">
      <!-- GS25 Text Shadow -->
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="138" fill="#0f172a" opacity="0.3" text-anchor="middle" letter-spacing="-2">GS25</text>
      <!-- GS25 Main Text -->
      <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="138" fill="#ffffff" text-anchor="middle" letter-spacing="-2">GS25</text>
      <!-- Subtle Cyan Highlight on text -->
      <text x="-2" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="138" fill="#e0f2fe" text-anchor="middle" letter-spacing="-2" opacity="0.6">GS25</text>
    </g>

    <!-- Bottom Status / Subtitle Pill: OFC SCHEDULE -->
    <g transform="translate(256, 385)">
      <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#0f172a" opacity="0.5"/>
      <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#38bdf8" text-anchor="middle" letter-spacing="3">OFC SCHEDULE</text>
    </g>
  </g>

  <!-- Sparkle Stars -->
  <g transform="translate(400, 110)">
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#fde047" opacity="0.9"/>
  </g>
  <g transform="translate(100, 360)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>
